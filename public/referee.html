<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Referee — SWAY</title>
  <meta name="description" content="Referee decision input for SWAY powerlifting meet management">
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; }
    body::before { display: none; }
    .referee-info { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 8px; }
    .referee-lifter { font-family: 'Outfit'; font-weight: 800; font-size: 1.4rem; color: var(--text-primary); }
    .referee-weight { font-family: 'Outfit'; font-weight: 900; font-size: 2rem; color: var(--accent-secondary); margin: 4px 0; }
    .referee-lift-info { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 20px; }
    .ref-selector { display: flex; gap: 8px; margin-bottom: 20px; justify-content: center; }
    .ref-select-btn { padding: 8px 20px; border-radius: 20px; border: 2px solid var(--border-light); background: var(--bg-tertiary); color: var(--text-secondary); font-weight: 700; cursor: pointer; transition: all 0.2s; }
    .ref-select-btn.active { border-color: var(--accent-primary); background: var(--accent-primary); color: white; }
    .decision-status { padding: 12px 16px; text-align: center; border-radius: var(--radius-md); margin-bottom: 16px; font-family: 'Outfit', sans-serif; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3); }
    .decision-status.submitted-white { background: rgba(255, 255, 255, 0.12); border: 2px solid #ffffff; }
    .decision-status.submitted-red { background: rgba(231, 76, 60, 0.2); border: 2px solid #e74c3c; }
    .referee-btn { transition: all 0.2s ease; position: relative; }
    .referee-btn.selected { outline: 5px solid #2ecc71 !important; outline-offset: 4px; transform: scale(1.02); box-shadow: 0 0 35px rgba(46, 204, 113, 0.7) !important; filter: brightness(1.1); }
    .referee-btn.dimmed { opacity: 0.3 !important; filter: grayscale(0.8) !important; pointer-events: none; transform: scale(0.95); }
  </style>
</head>
<body>
  <div class="referee-container">
    <div style="text-align:center">
      <div style="display:flex; align-items:center; justify-content:center; gap:8px; margin-bottom:4px">
        <span id="statusDot" class="status-dot offline"></span>
        <div style="font-family:'Outfit';font-weight:800;font-size:1.2rem;color:var(--accent-secondary)">⚡ SWAY</div>
      </div>
      <div class="referee-title">Referee Panel</div>
    </div>

    <div class="ref-selector">
      <button class="ref-select-btn" onclick="selectRef(1)" id="refSelect1">Left</button>
      <button class="ref-select-btn" onclick="selectRef(2)" id="refSelect2">Head</button>
      <button class="ref-select-btn" onclick="selectRef(3)" id="refSelect3">Right</button>
    </div>

    <!-- Pinned at TOP for immediate visibility without scrolling -->
    <div class="decision-status" id="decisionStatus" style="display:none"></div>

    <div style="text-align:center">
      <div class="referee-info" id="refLiftInfo">Waiting for the meet to start...</div>
      <div class="referee-lifter" id="refLifterName">—</div>
      <div class="referee-weight" id="refWeight">—</div>
      <div class="referee-lift-info" id="refAttemptInfo"></div>
      <div id="refDivisionInfo" style="font-size:0.8rem;color:var(--accent-secondary);font-family:'Roboto Condensed';font-weight:700;letter-spacing:0.5px;margin-top:-12px;margin-bottom:20px"></div>
    </div>

    <div class="referee-buttons" id="refButtons">
      <button class="referee-btn referee-btn-good" onclick="submitRefDecision('white')" id="goodLiftBtn">
        <span class="emoji">⬜</span>
        GOOD LIFT
      </button>
      <button class="referee-btn referee-btn-nolift" onclick="submitRefDecision('red')" id="noLiftBtn">
        <span class="emoji">🟥</span>
        NO LIFT
      </button>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script>
    const meetId = getParam('meetId');
    const platform = parseInt(getParam('platform') || '1');
    let selectedRef = parseInt(getParam('ref') || '0');
    let currentLifter = null;
    let currentLiftType = '';
    let currentAttemptNum = 1;
    let currentAttemptData = null;
    let hasSubmitted = false;
    let meetUnits = 'kg';

    // Try to load ref selection from storage
    if (!selectedRef) {
      selectedRef = parseInt(localStorage.getItem(`sway_ref_${meetId}`) || '0');
    }
    if (selectedRef) {
      document.getElementById(`refSelect${selectedRef}`).classList.add('active');
    }

    function selectRef(num) {
      selectedRef = num;
      localStorage.setItem(`sway_ref_${meetId}`, num);
      document.querySelectorAll('.ref-select-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`refSelect${num}`).classList.add('active');

      updateButtonState();
    }

    function applyVoteHighlight(decision) {
      const goodBtn = document.getElementById('goodLiftBtn');
      const noLiftBtn = document.getElementById('noLiftBtn');
      const status = document.getElementById('decisionStatus');
      if (!goodBtn || !noLiftBtn || !status) return;

      if (decision === 'white') {
        goodBtn.classList.add('selected');
        goodBtn.classList.remove('dimmed');
        noLiftBtn.classList.add('dimmed');
        noLiftBtn.classList.remove('selected');
      } else if (decision === 'red') {
        noLiftBtn.classList.add('selected');
        noLiftBtn.classList.remove('dimmed');
        goodBtn.classList.add('dimmed');
        goodBtn.classList.remove('selected');
      } else {
        goodBtn.classList.remove('selected', 'dimmed');
        noLiftBtn.classList.remove('selected', 'dimmed');
        goodBtn.disabled = false;
        noLiftBtn.disabled = false;
        status.style.display = 'none';
        return;
      }

      goodBtn.disabled = true;
      noLiftBtn.disabled = true;
      status.style.display = 'block';
      status.className = `decision-status submitted submitted-${decision}`;
      
      const posName = selectedRef === 1 ? 'Left' : selectedRef === 2 ? 'Head' : 'Right';
      const decName = decision === 'white' ? 'GOOD LIFT (WHITE)' : 'NO LIFT (RED)';
      const decEmoji = decision === 'white' ? '⬜' : '🟥';
      
      status.replaceChildren();
      const wrap = document.createElement('div');
      wrap.style.display = 'flex';
      wrap.style.alignItems = 'center';
      wrap.style.justifyContent = 'center';
      wrap.style.gap = '10px';

      const emojiSpan = document.createElement('span');
      emojiSpan.style.fontSize = '1.6rem';
      emojiSpan.textContent = decEmoji;

      const textWrap = document.createElement('div');
      textWrap.style.textAlign = 'left';

      const titleEl = document.createElement('div');
      titleEl.style.fontWeight = '800';
      titleEl.style.fontSize = '1.05rem';
      titleEl.style.color = 'var(--text-primary)';
      titleEl.textContent = `Vote Sent: ${decName}`;

      const subEl = document.createElement('div');
      subEl.style.color = 'var(--text-secondary)';
      subEl.style.fontSize = '0.8rem';
      subEl.textContent = `Referee ${posName} Position`;

      textWrap.append(titleEl, subEl);
      wrap.append(emojiSpan, textWrap);
      status.appendChild(wrap);

      if (typeof navigator !== 'undefined' && navigator.vibrate) {
        try { navigator.vibrate(60); } catch (_) {}
      }
    }

    function updateButtonState() {
      if (!selectedRef || !currentAttemptData) {
        applyVoteHighlight(null);
        return;
      }
      const refKey = `ref${selectedRef}`;
      const myVote = currentAttemptData[refKey];
      
      if (myVote === 'white' || myVote === 'red') {
        hasSubmitted = true;
        applyVoteHighlight(myVote);
      } else {
        hasSubmitted = false;
        applyVoteHighlight(null);
      }
    }

    // Register other listeners before connecting
    socket.on('reconnected', () => {
      showToast('Connected — Syncing...', 'success');
      init();
    });
    socket.on('connected', updateStatusUI);
    socket.on('disconnected', updateStatusUI);
    socket.connect();
    updateStatusUI();
    init(); // Load initial state

    // Periodically refresh meet units
    setInterval(async () => {
      try {
        const m = await API.getMeet(meetId);
        meetUnits = (m.units === 'lbs' ? 'lbs' : 'kg');
      } catch (e) {}
    }, 5000);
    
    socket.on('state_changed', (data) => {
      if (data.meetId !== meetId) return;
      init(); // Re-fetch data on state change
    });
    
    socket.on('attempt_updated', (data) => {
      if (data.meetId === meetId) init();
    });

    socket.on('decision_made', (data) => {
      if (data.meetId === meetId) init();
    });

    async function submitRefDecision(decision) {
      if (!selectedRef) {
        showToast('Please select your referee position (Left, Head, or Right)', 'error');
        return;
      }
      if (!currentLifter) {
        showToast('No current lifter', 'error');
        return;
      }
      if (hasSubmitted) return;
      
      hasSubmitted = true;
      applyVoteHighlight(decision);
      
      const refKey = `ref${selectedRef}`;
      const data = { [refKey]: decision };
      
      try {
        await API.recordDecision(currentLifter.id, currentLiftType, currentAttemptNum, data);
        if (currentAttemptData) {
          currentAttemptData[refKey] = decision;
        }
      } catch (err) {
        hasSubmitted = false;
        applyVoteHighlight(null);
        showToast('Failed to submit: ' + err.message, 'error');
      }
    }

    async function init() {
      try {
        const meet = await API.getMeet(meetId);
        meetUnits = (meet.units === 'lbs' ? 'lbs' : 'kg');
        
        const state = await API.getMeetState(meetId);
        if (state.current_lifter_id) {
          const lifter = await API.getLifter(state.current_lifter_id);
          const att = lifter.attempts?.find(a => a.lift_type === state.current_lift_type && a.attempt_number === state.current_attempt_number);
          currentLifter = lifter;
          currentLiftType = state.current_lift_type;
          currentAttemptNum = state.current_attempt_number;
          currentAttemptData = att || null;

          document.getElementById('refLifterName').textContent = lifter.name;
          document.getElementById('refWeight').textContent = att?.weight ? `${att.weight} ${meetUnits}` : '—';
          document.getElementById('refAttemptInfo').textContent = `${LIFT_NAMES[state.current_lift_type] || ''} — Attempt ${state.current_attempt_number}`;
          document.getElementById('refLiftInfo').textContent = lifter.team || '';

          const div = lifter.division_name || '';
          const wc = lifter.weight_class_name || '';
          const flightLabel = lifter.flight ? `Flight ${lifter.flight}` : '';
          document.getElementById('refDivisionInfo').textContent = [flightLabel, div, wc].filter(Boolean).join(' · ');
          updateButtonState();
        }
      } catch (e) { console.log('Referee init error:', e); }
    }
  </script>
</body>
</html>
